<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwergenpass-Karten zum Ausdrucken</title>
<link href="schrift/schrift.css" rel="stylesheet">
<style>
  @page { size: A4; margin: 10mm; }
  body { margin: 0; font-family: 'Insel Text', sans-serif; color: #3a2617; background: #eee; }
  .hinweis { max-width: 190mm; margin: 12px auto; padding: 12px 16px; background: #fff; border-radius: 10px; font-size: 15px; }
  .hinweis button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 2px solid #8a6438; background: #e8b23a; cursor: pointer; }
  .blatt { width: 190mm; align-content: start; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; background: #fff; padding: 6mm; box-sizing: border-box; }
  .karte { border: 0.6mm solid #8a6438; border-radius: 4mm; padding: 4mm 5mm; height: 52mm; box-sizing: border-box; display: flex; flex-direction: column; gap: 1.6mm; break-inside: avoid; }
  .kopf { display: flex; align-items: center; gap: 3mm; }
  .kopf img { width: 12mm; height: 12mm; border-radius: 2mm; }
  .nr { margin-left: auto; min-width: 12mm; height: 12mm; border-radius: 3mm; background: #8a4b1c; color: #fff4dc; font-family: 'Insel Titel', sans-serif; font-size: 20pt; display: flex; align-items: center; justify-content: center; padding: 0 2mm; box-sizing: border-box; }
  .blatt + .blatt { margin-top: 6mm; break-before: page; }
  .titel { font-family: 'Insel Titel', sans-serif; font-size: 16pt; line-height: 1; }
  .name { font-size: 10pt; border-bottom: 0.3mm solid #8a6438; padding-bottom: 1mm; }
  .codes { display: grid; grid-template-columns: auto 1fr; gap: 1mm 2mm; font-size: 9pt; align-items: end; }
  .codes span:nth-child(even) { border-bottom: 0.3mm dotted #8a6438; height: 5mm; }
  .klein { font-size: 7.5pt; color: #6b5442; }
  .leiste { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #3a2617; color: #fff4dc; }
  .leiste span { margin-right: auto; font-family: 'Insel Titel', sans-serif; font-size: 20px; }
  .leiste a, .leiste button { font: inherit; font-weight: 700; color: #3a2617; background: #e8b23a; border: 0; border-radius: 8px; padding: 10px 16px; min-height: 44px; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; }
  .leiste a.zurueck { background: #fff4dc; }
  @media print { body { background: #fff; } .hinweis, .leiste { display: none; } .blatt { padding: 0; } }
</style>
</head>
<body>
<div class="leiste"><a class="zurueck" href="index.html#lehrkraft">← Zurück</a><span>Zwergenpass-Karten</span><button onclick="window.print()">Drucken</button></div>
<div class="hinweis">
  Jede Karte hat eine feste Nummer. Mit dieser Nummer kommt das Material auf die Insel. Gebt jedem Kind eine Karte und lasst es dieselbe Nummer behalten. Gedruckt werden so viele Karten, wie die Klasse Kinder hat, plus 3 Ersatzkarten (10 Karten pro Blatt). Anzahl: <input id="anzahl" type="number" min="1" max="32" value="27" style="width:60px;font:inherit">
  <button onclick="window.print()">Drucken</button>
</div>
<div id="blaetter"></div>
<script>
  const ziel = document.getElementById('blaetter');
  const feld = document.getElementById('anzahl');
  function karte(n) {
    return `
      <div class="karte">
        <div class="kopf"><img src="bilder/app-icon.png" alt=""><div class="titel">Zwergenpass</div><div class="nr">${n}</div></div>
        <div class="name">Name:</div>
        <div class="codes">
          <span>1. Stunde</span><span></span>
          <span>2. Stunde</span><span></span>
          <span>3. Stunde</span><span></span>
          <span>4. Stunde</span><span></span>
        </div>
        <div class="klein">Karte ${n} · Immer den neuesten Code benutzen. Keine 0, 1, I oder O im Code.</div>
      </div>`;
  }
  function zeichne() {
    const n = Math.max(1, Math.min(32, Number(feld.value) || 27));
    const gesamt = Math.min(32, n + 3);
    let html = '';
    for (let start = 1; start <= gesamt; start += 10) {
      html += '<div class="blatt">';
      for (let i = start; i < start + 10 && i <= gesamt; i++) html += karte(i);
      html += '</div>';
    }
    ziel.innerHTML = html;
  }
  try { const alt = localStorage.getItem('zi-karten-anzahl'); if (alt) feld.value = alt; } catch (e) { /* egal */ }
  feld.addEventListener('input', () => { try { localStorage.setItem('zi-karten-anzahl', feld.value); } catch (e) { /* egal */ } zeichne(); });
  zeichne();
</script>
</body>
</html>
