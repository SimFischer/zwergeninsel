<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwergenpass-Karten zum Ausdrucken</title>
<link href="schrift/schrift.css" rel="stylesheet">
<style>
  @page { size: A4; margin: 10mm; }
  body { margin: 0; font-family: 'Insel Text', sans-serif; color: #3a2617; background: #eee; }
  .hinweis { max-width: 190mm; margin: 12px auto; padding: 12px 16px; background: #fff; border-radius: 10px; font-size: 15px; }
  .hinweis button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 2px solid #8a6438; background: #e8b23a; cursor: pointer; }
  /* 8 Karten pro A4-Blatt (2 × 4), jede 88 × 64 mm – alles liegt sicher innerhalb der Karte */
  .blatt { width: 186mm; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 64mm; gap: 5mm 6mm; background: #fff; padding: 6mm; box-sizing: border-box; }
  .blatt + .blatt { margin-top: 6mm; break-before: page; }
  .karte { position: relative; overflow: hidden; height: 64mm; box-sizing: border-box; padding: 3.5mm 4.5mm 3mm; display: grid; grid-template-rows: auto auto 1fr auto; row-gap: 1.6mm; break-inside: avoid;
    border-radius: 4mm; border: 0.7mm solid #8a6438; box-shadow: inset 0 0 0 1.2mm #f4e6c8, inset 0 0 0 1.5mm #c9a46a;
    background: linear-gradient(160deg, #fbf3e1 0%, #f6ead0 55%, #efdfbd 100%); }
  /* Eck-Verzierung (wenig Tinte) */
  .karte::before, .karte::after { content: ''; position: absolute; width: 6mm; height: 6mm; border: 0.5mm solid #b48a52; }
  .karte::before { left: 2.4mm; bottom: 2.4mm; border-right: 0; border-top: 0; border-radius: 0 0 0 2mm; }
  .karte::after { right: 2.4mm; bottom: 2.4mm; border-left: 0; border-top: 0; border-radius: 0 0 2mm 0; }
  .kopf { display: flex; align-items: center; gap: 3mm; min-height: 14mm; }
  .portrait { width: 14mm; height: 14mm; border-radius: 50%; overflow: hidden; flex: none; border: 0.6mm solid #8a6438; background: #efdfbd; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; display: block; transform: scale(1.9); transform-origin: 50% 8%; }
  .portrait img[src*='pass-motiv'] { transform: none; object-position: 50% 50%; }
  .titel { font-family: 'Insel Titel', sans-serif; font-size: 15pt; line-height: 1.05; }
  .titel small { display: block; font-family: 'Insel Text', sans-serif; font-size: 7.5pt; color: #6b5442; letter-spacing: .02em; }
  .nr { margin-left: auto; min-width: 12mm; height: 12mm; border-radius: 3mm; background: #8a4b1c; color: #fff4dc; font-family: 'Insel Titel', sans-serif; font-size: 19pt; display: flex; align-items: center; justify-content: center; padding: 0 2mm; box-sizing: border-box; }
  .name { font-size: 10pt; line-height: 1.2; border-bottom: 0.3mm solid #8a6438; padding: 0.5mm 0 1.2mm; }
  .codes { display: grid; grid-template-columns: auto 1fr; column-gap: 2.5mm; grid-auto-rows: 1fr; font-size: 9pt; align-items: end; min-height: 0; }
  .codes span { line-height: 1.2; padding-bottom: 0.6mm; }
  .codes span:nth-child(even) { border-bottom: 0.3mm dotted #8a6438; height: 100%; padding: 0; }
  .klein { font-size: 7pt; line-height: 1.25; color: #6b5442; padding: 0 6mm; text-align: center; }
  .leiste { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #3a2617; color: #fff4dc; }
  .leiste span { margin-right: auto; font-family: 'Insel Titel', sans-serif; font-size: 20px; }
  .leiste a, .leiste button { font: inherit; font-weight: 700; color: #3a2617; background: #e8b23a; border: 0; border-radius: 8px; padding: 10px 16px; min-height: 44px; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; }
  .leiste a.zurueck { background: #fff4dc; }
  @media print { body { background: #fff; } .hinweis, .leiste { display: none; } .blatt { padding: 0; } }
</style>
</head>
<body>
<div class="leiste"><a class="zurueck" href="index.html#lehrkraft">← Zurück</a><span>Zwergenpass-Karten</span><button onclick="window.print()">Drucken</button></div>
<div class="hinweis">
  Jede Karte hat eine feste Nummer. Mit dieser Nummer kommt das Material auf die Insel. Gebt jedem Kind eine Karte und lasst es dieselbe Nummer behalten. Gedruckt werden so viele Karten, wie die Klasse Kinder hat, plus 3 Ersatzkarten (8 Karten pro Blatt). Anzahl: <input id="anzahl" type="number" min="1" max="32" value="27" style="width:60px;font:inherit">
  <button onclick="window.print()">Drucken</button>
</div>
<div id="blaetter"></div>
<script>
  const ziel = document.getElementById('blaetter');
  const feld = document.getElementById('anzahl');
  /* Motiv fest nach Kartennummer: Karte 1 → Motiv 1, … (gleich bei jedem Druck).
     Eigene Motive bilder/pass-motiv-01.png … -12.png werden genutzt, sobald es sie gibt; sonst das Zwergenporträt. */
  const ZWERGE = ['01-brumm', '02-hilda', '03-tarek', '04-svea', '05-kira', '06-ole', '07-fenno', '08-smaragda', '09-bodo', '10-amara', '11-grimbart', '12-rubina'];
  function portrait(n) {
    const i = (n - 1) % ZWERGE.length; const nr = String(i + 1).padStart(2, '0');
    return `<img src="bilder/pass-motiv-${nr}.png" alt="" onerror="this.onerror=null;this.src='bilder/zwerg-${ZWERGE[i]}.png'">`;
  }
  function karte(n) {
    return `
      <div class="karte">
        <div class="kopf"><div class="portrait">${portrait(n)}</div><div class="titel">Zwergenpass<small>Zwergeninsel · Argumente-Schmiede</small></div><div class="nr">${n}</div></div>
        <div class="name">Name:</div>
        <div class="codes">
          <span>1. Stunde</span><span></span>
          <span>2. Stunde</span><span></span>
          <span>3. Stunde</span><span></span>
          <span>4. Stunde</span><span></span>
        </div>
        <div class="klein">Immer den neuesten Code benutzen. Keine 0, 1, I oder O.</div>
      </div>`;
  }
  function zeichne() {
    const n = Math.max(1, Math.min(32, Number(feld.value) || 27));
    const gesamt = Math.min(32, n + 3);
    let html = '';
    for (let start = 1; start <= gesamt; start += 8) {
      html += '<div class="blatt">';
      for (let i = start; i < start + 8 && i <= gesamt; i++) html += karte(i);
      html += '</div>';
    }
    ziel.innerHTML = html;
  }
  try { const alt = localStorage.getItem('zi-karten-anzahl'); if (alt) feld.value = alt; } catch (e) { /* egal */ }
  feld.addEventListener('input', () => { try { localStorage.setItem('zi-karten-anzahl', feld.value); } catch (e) { /* egal */ } zeichne(); });
  zeichne();
</script>
</body>
</html>
