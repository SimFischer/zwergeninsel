<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwergenpass-Karten zum Ausdrucken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 10mm; }
  body { margin: 0; font-family: 'Andika', sans-serif; color: #3a2617; background: #eee; }
  .hinweis { max-width: 190mm; margin: 12px auto; padding: 12px 16px; background: #fff; border-radius: 10px; font-size: 15px; }
  .hinweis button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 2px solid #8a6438; background: #e8b23a; cursor: pointer; }
  .blatt { width: 190mm; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; background: #fff; padding: 6mm; box-sizing: border-box; }
  .karte { border: 0.6mm solid #8a6438; border-radius: 4mm; padding: 4mm 5mm; height: 52mm; box-sizing: border-box; display: flex; flex-direction: column; gap: 1.6mm; break-inside: avoid; }
  .kopf { display: flex; align-items: center; gap: 3mm; }
  .kopf img { width: 12mm; height: 12mm; border-radius: 2mm; }
  .titel { font-family: 'Lilita One', sans-serif; font-size: 16pt; line-height: 1; }
  .name { font-size: 10pt; border-bottom: 0.3mm solid #8a6438; padding-bottom: 1mm; }
  .codes { display: grid; grid-template-columns: auto 1fr; gap: 1mm 2mm; font-size: 9pt; align-items: end; }
  .codes span:nth-child(even) { border-bottom: 0.3mm dotted #8a6438; height: 5mm; }
  .klein { font-size: 7.5pt; color: #6b5442; }
  @media print { body { background: #fff; } .hinweis { display: none; } .blatt { padding: 0; } }
</style>
</head>
<body>
<div class="hinweis">
  Ein Blatt ergibt 10 Zwergenpass-Karten. Für 25 Kinder drei Blätter drucken, am besten auf etwas festeres Papier.
  <button onclick="window.print()">Drucken</button>
</div>
<div class="blatt" id="blatt"></div>
<script>
  const blatt = document.getElementById('blatt');
  for (let i = 0; i < 10; i++) {
    blatt.insertAdjacentHTML('beforeend', `
      <div class="karte">
        <div class="kopf"><img src="bilder/app-icon.png" alt=""><div class="titel">Zwergenpass</div></div>
        <div class="name">Name:</div>
        <div class="codes">
          <span>1. Stunde</span><span></span>
          <span>2. Stunde</span><span></span>
          <span>3. Stunde</span><span></span>
          <span>4. Stunde</span><span></span>
        </div>
        <div class="klein">Immer den neuesten Code benutzen. Keine 0, 1, I oder O im Code.</div>
      </div>`);
  }
</script>
</body>
</html>
